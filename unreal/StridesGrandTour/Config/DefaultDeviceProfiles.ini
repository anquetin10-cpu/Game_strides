; Jalon J5 « Finition et performance » : profil mobile du jeu sur iPhone et iPad.
; Objectif : 30 images par seconde stables sur un iPhone récent (verrou à 30 i/s dans DefaultEngine.ini, FrameRateLock).
; Les iPhone 15 à 18 et les iPad Pro récents héritent d'IOS_Epic dans le moteur (BaseDeviceProfiles.ini). IOS_Epic
; règle tout au maximum et rend à 2x : c'est trop pour ce monde ouvert. Le jeu ramène donc IOS_Epic et IOS_High au
; même réglage « Strides mobile ». Tous les appareils récents ont ainsi un seul profil, le plus simple à mesurer.
; Budgets et mesures : unreal/docs/livraison/plan.md, section J5. Valeurs iOS à confirmer sur appareil (J6).
;
; Réglage Strides mobile (choix n° 39 du plan) :
; - définition 1,5x les points de l'écran (r.MobileContentScaleFactor=1.5), comme le jeu web sur écran tactile
;   (game.js applyQuality : pixelRatio = min(dpr, 1,5) en « auto ») ; 1266 x 585 sur un iPhone de 844 x 390 points ;
; - distance de vue 0,8 (sg.ViewDistanceQuality=1 puis r.ViewDistanceScale=0.8) ;
; - ombres : une cascade de 1024, distance 0,7 (sg.ShadowQuality=1, r.Shadow.CSM.MaxMobileCascades=1) ;
; - post-traitement réduit (sg.PostProcessQuality=1 : bloom bas, ni profondeur de champ, ni occlusion ambiante) ;
; - effets moyens, herbe à 0,8 (sg.EffectsQuality=1, sg.FoliageQuality=1) ;
; - textures hautes (sg.TextureQuality=2) : peu de textures dans ce monde, la mémoire le permet (mesure J5).
; La foule (passants, voitures, tribunes) suit le jeu web, sans réduction : son coût est mesuré à part (perf-monde).

[IOS_Epic DeviceProfile]
-CVars=r.MobileContentScaleFactor=2
+CVars=r.MobileContentScaleFactor=1.5
-CVars=sg.ViewDistanceQuality=3
+CVars=sg.ViewDistanceQuality=1
-CVars=sg.AntiAliasingQuality=3
+CVars=sg.AntiAliasingQuality=1
-CVars=sg.ShadowQuality=3
+CVars=sg.ShadowQuality=1
-CVars=sg.GlobalIlluminationQuality=3
+CVars=sg.GlobalIlluminationQuality=1
-CVars=sg.ReflectionQuality=3
+CVars=sg.ReflectionQuality=1
-CVars=sg.PostProcessQuality=3
+CVars=sg.PostProcessQuality=1
-CVars=sg.TextureQuality=3
+CVars=sg.TextureQuality=2
-CVars=sg.EffectsQuality=3
+CVars=sg.EffectsQuality=1
-CVars=sg.FoliageQuality=3
+CVars=sg.FoliageQuality=1
+CVars=r.ViewDistanceScale=0.8
+CVars=r.Shadow.CSM.MaxMobileCascades=1
+CVars=r.Shadow.DistanceScale=0.7


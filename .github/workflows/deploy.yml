name: Tests et déploiement (GitHub Pages)

# Tests sur toutes les branches ; publication sur GitHub Pages seulement depuis les branches publiées, après les tests.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Version publiée : aucun accès de test (window.__game, ?autostart…), voir src/core/devHooks.js.
      - name: Accès de test absents du build publié
        run: |
          if grep -l -e '__game' -e 'autostart' dist/assets/*.js; then echo "Accès de test trouvés dans dist/"; exit 1; fi
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && contains(fromJSON('["refs/heads/main","refs/heads/master","refs/heads/claude/strides-grand-tour"]'), github.ref)
        with:
          path: dist

  # Série courte de bout en bout (tests/e2e/smoke.mjs) : Chromium en rendu logiciel, émulation tactile ; pas un iPhone.
  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Serveur de développement (accès de test actifs)
        run: |
          npx vite --port 5173 --strictPort > vite.log 2>&1 &
          for i in $(seq 60); do curl -sf http://127.0.0.1:5173/ > /dev/null && exit 0; sleep 2; done; cat vite.log; exit 1
      - run: npm run e2e
        env:
          BASE: http://127.0.0.1:5173
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-smoke
          path: tests/e2e/out/smoke
          retention-days: 14

  deploy:
    if: github.event_name != 'pull_request' && contains(fromJSON('["refs/heads/main","refs/heads/master","refs/heads/claude/strides-grand-tour"]'), github.ref)
    needs: [build, e2e-smoke]
    runs-on: ubuntu-latest
    # Ne bloque pas la CI tant que GitHub Pages n'est pas activé (Settings → Pages → Source : GitHub Actions).
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
